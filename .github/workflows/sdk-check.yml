name: SDK checks
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
permissions:
  contents: read
# Our runners only, never GitHub-hosted (owner order 2026-11-04): the ephemeral k3s scale set ci-sdk-electron
# (class sdk: Xvfb + Chromium libs, no sudo). Only macOS work runs on the Mac (owner 2026-11-17): the package is
# plain JS (no native module) and the unit tests use an in-memory Electron stand-in (the platform is passed
# explicitly), so the former macOS leg, like the earlier windows-latest leg, repeated the Linux build and is dropped.
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: '"ci-sdk-electron"' }
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 30
    env:
      # Unit tests use an in-memory Electron stand-in; the binary is only needed for the example.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Verify pinned and frozen sources
        run: python3 scripts/verify-release.py
      - name: Install
        run: npm ci
      - name: Build SDK (ESM + CJS + types + sandboxed preload)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Pack
        run: npm pack
      - name: Build example against the packed SDK
        working-directory: example-app
        shell: bash
        run: |
          npm ci
          npm install --no-save ../busymate-ai-electron-1.0.4.tgz
          node -e "const s=require('@busymate/ai-electron'); if (s.SDK_VERSION!=='1.0.4') process.exit(1); const fs=require('fs'); for (const p of [s.preloadPath(), s.bridgePreloadPath()]) if (!fs.existsSync(p)) { console.error('missing', p); process.exit(1) } console.log('example resolves', s.SDK_VERSION, s.preloadPath())"
          node --check main.js && node --check settings-preload.js && node --check renderer/settings.js
      - if: matrix.os == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: busymate-ai-electron-1.0.4
          path: busymate-ai-electron-1.0.4.tgz

  smoke:
    name: smoke (xvfb, example app)
    runs-on: ci-sdk-electron
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Build and pack SDK
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci && npm run build && npm pack
      - name: Install example (downloads Electron)
        working-directory: example-app
        run: |
          npm ci
          npm install --no-save ../busymate-ai-electron-1.0.4.tgz
      # The k3s runner pod runs with no-new-privs and no user namespaces, so Chromium's OS-level process sandbox
      # (setuid helper or userns) cannot start there: the example launches with --no-sandbox. The renderer's
      # webPreferences (sandbox: true, contextIsolation, no nodeIntegration) are still asserted by the smoke itself.
      - name: Launch example under xvfb
        working-directory: example-app
        run: |
          set -o pipefail
          timeout 180 xvfb-run -a npx electron . --no-sandbox --busymate-smoke 2>&1 | tee smoke.log
          grep -q '^SMOKE_RESULT {.*"ok":true' smoke.log

  sdk-check:
    if: ${{ always() && !cancelled() }}  # a cancelled run must not turn the gate red
    needs: [build, smoke]
    runs-on: ci-sdk-electron
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No GitHub-hosted runners (runs-on lint)
        run: python3 .github/runs-on-lint.py
      - name: All SDK checks passed
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.smoke.result }}" = success
