name: SDK checks
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unit tests use an in-memory Electron stand-in; the binary is only needed for the example.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned and frozen sources
        run: python scripts/verify-release.py
      - name: Install
        run: npm ci
      - name: Build SDK (ESM + CJS + types + sandboxed preload)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Pack
        run: npm pack
      - name: Build example against the packed SDK
        working-directory: example-app
        shell: bash
        run: |
          npm ci
          npm install --no-save ../busymate-ai-electron-1.0.0.tgz
          node -e "const s=require('@busymate/ai-electron'); if (s.SDK_VERSION!=='1.0.0') process.exit(1); const fs=require('fs'); for (const p of [s.preloadPath(), s.bridgePreloadPath()]) if (!fs.existsSync(p)) { console.error('missing', p); process.exit(1) } console.log('example resolves', s.SDK_VERSION, s.preloadPath())"
          node --check main.js && node --check settings-preload.js && node --check renderer/settings.js
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: busymate-ai-electron-1.0.0
          path: busymate-ai-electron-1.0.0.tgz

  smoke:
    name: smoke (xvfb, example app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build and pack SDK
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci && npm run build && npm pack
      - name: Install example (downloads Electron)
        working-directory: example-app
        run: |
          npm ci
          npm install --no-save ../busymate-ai-electron-1.0.0.tgz
      - name: Allow the Chromium sandbox on the runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Launch example under xvfb
        working-directory: example-app
        run: |
          set -o pipefail
          timeout 180 xvfb-run -a npx electron . --busymate-smoke 2>&1 | tee smoke.log
          grep -q '^SMOKE_RESULT {.*"ok":true' smoke.log

  sdk-check:
    if: always()
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: All SDK checks passed
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.smoke.result }}" = success
