name: SDK checks
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
permissions:
  contents: read
# Our runners only, never GitHub-hosted (owner order 2026-11-04): Linux = ephemeral k3s scale set ci-sdk-electron
# (class sdk: Xvfb + Chromium libs, no sudo), macOS = the Mac runner bm-mac-busymate-ai-sdk-electron. There is no
# Windows runner; the package is plain JS (no native module), so the former windows-latest leg is dropped.
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: '"ci-sdk-electron"' }
          - { os: macos, runner: '["self-hosted","macOS","bm-mac"]' }
    runs-on: ${{ fromJSON(matrix.runner) }}
    # Mac jobs: the timeout includes the wait for the shared Mac's one-job lock.
    timeout-minutes: ${{ contains(toJSON(matrix), 'bm-mac') && 150 || 30 }}
    env:
      # Unit tests use an in-memory Electron stand-in; the binary is only needed for the example.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify pinned and frozen sources
        run: python3 scripts/verify-release.py
      - name: Install
        run: npm ci
      - name: Build SDK (ESM + CJS + types + sandboxed preload)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Pack
        run: npm pack
      - name: Build example against the packed SDK
        working-directory: example-app
        shell: bash
        run: |
          npm ci
          npm install --no-save ../busymate-ai-electron-1.0.2.tgz
          node -e "const s=require('@busymate/ai-electron'); if (s.SDK_VERSION!=='1.0.2') process.exit(1); const fs=require('fs'); for (const p of [s.preloadPath(), s.bridgePreloadPath()]) if (!fs.existsSync(p)) { console.error('missing', p); process.exit(1) } console.log('example resolves', s.SDK_VERSION, s.preloadPath())"
          node --check main.js && node --check settings-preload.js && node --check renderer/settings.js
      - if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: busymate-ai-electron-1.0.2
          path: busymate-ai-electron-1.0.2.tgz

  smoke:
    name: smoke (xvfb, example app)
    runs-on: ci-sdk-electron
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build and pack SDK
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci && npm run build && npm pack
      - name: Install example (downloads Electron)
        working-directory: example-app
        run: |
          npm ci
          npm install --no-save ../busymate-ai-electron-1.0.2.tgz
      # The k3s runner pod runs with no-new-privs and no user namespaces, so Chromium's OS-level process sandbox
      # (setuid helper or userns) cannot start there: the example launches with --no-sandbox. The renderer's
      # webPreferences (sandbox: true, contextIsolation, no nodeIntegration) are still asserted by the smoke itself.
      - name: Launch example under xvfb
        working-directory: example-app
        run: |
          set -o pipefail
          timeout 180 xvfb-run -a npx electron . --no-sandbox --busymate-smoke 2>&1 | tee smoke.log
          grep -q '^SMOKE_RESULT {.*"ok":true' smoke.log

  sdk-check:
    if: always()
    needs: [build, smoke]
    runs-on: ci-sdk-electron
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No GitHub-hosted runners (runs-on lint)
        run: python3 .github/runs-on-lint.py
      - name: All SDK checks passed
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.smoke.result }}" = success
